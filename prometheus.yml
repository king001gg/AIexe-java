global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'ai-rag-agent'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          application: 'ai-rag-agent'
          environment: 'production'

  - job_name: 'spring-boot'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  - job_name: 'milvus'
    static_configs:
      - targets: ['localhost:19530']

  - job_name: 'mysql'
    static_configs:
      - targets: ['localhost:3306']

rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
