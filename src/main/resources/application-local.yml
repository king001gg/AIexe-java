# 本地开发环境配置（无外部依赖，使用 H2 内存数据库）
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: local

  # H2 内存数据库
  datasource:
    url: jdbc:h2:mem:ai_rag_db;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 不自动执行 MySQL 语法的 schema.sql
  sql:
    init:
      mode: never

  # 表结构由 Flyway 创建（classpath:db/migration/h2），JPA 不再建表
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  # Redis（懒连接，无 Redis 时不影响启动）
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 4
          min-idle: 0
          max-wait: -1ms

# Milvus（本地不连接）
milvus:
  host: localhost
  port: 19530

# 本地开发关闭认证与限流，避免打断 curl 冒烟测试
security:
  enabled: false

rate-limit:
  enabled: false

# 健康检查（修复缺陷 D7）
#
# Spring Boot 默认把 RedisHealthIndicator 计入整体健康，而本机不跑 Redis，
# 于是 /actuator/health 恒为 503 DOWN —— 在 K8s 里这意味着 Pod 永远不 Ready，
# 但要命的不是「Redis 挂了」而是「服务其实能跑，只是被可选的依赖拖垮了」。
#
# 本项目里 Redis 是**可选**依赖：连接是懒建立的，缓存不可用时业务照常走库。
# 因此本地关掉这个指示器。生产环境若把 Redis 当必需组件，应保持开启，
# 并改用 health group 区分 liveness / readiness，而不是让 /health 一票否决。
management:
  health:
    redis:
      enabled: false

# 日志
logging:
  level:
    com.ai.rag: INFO
    org.springframework.web: INFO
    dev.langchain4j: WARN
